<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flores Amarillas para Ti 🌻</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Fondo animado -->
    <div class="fondo">

        <div class="corazones"></div>
        <div class="estrellas"></div>

    </div>


    <!-- Contenido principal -->
    <main class="contenedor">

        <h1 class="titulo">
            Flores Amarillas
        </h1>

        <p class="subtitulo">
            Para alguien muy especial 💛
        </p>


        <!-- Cúpula -->
        <div class="domo">

            <div class="brillo-domo"></div>

            <div class="base"></div>

            <!-- Flores -->
            <div class="flores">

                <!-- Flor 1 -->
                <div class="flor flor1">

                    <div class="petalos">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                    <div class="centro"></div>

                    <div class="tallo"></div>

                    <div class="hoja hoja1"></div>
                    <div class="hoja hoja2"></div>

                </div>


                <!-- Flor 2 -->
                <div class="flor flor2">

                    <div class="petalos">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                    <div class="centro"></div>

                    <div class="tallo"></div>

                    <div class="hoja hoja1"></div>
                    <div class="hoja hoja2"></div>

                </div>


                <!-- Flor 3 -->
                <div class="flor flor3">

                    <div class="petalos">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                    <div class="centro"></div>

                    <div class="tallo"></div>

                    <div class="hoja hoja1"></div>
                    <div class="hoja hoja2"></div>

                </div>

            </div>

        </div>


        <!-- Botón -->
        <button id="abrirCarta" class="boton">
            💌 Abrir mi carta
        </button>

    </main>


    <!-- Carta -->
    <div id="carta" class="carta-overlay">

        <div class="carta">

            <button id="cerrarCarta" class="cerrar">
                ×
            </button>

            <div class="sobre">
                💛
            </div>

            <h2>Para ti 🌻</h2>

            <p>
                Estas flores amarillas son para recordarte
                lo especial que eres.
            </p>

            <p>
                Que nunca te falten motivos para sonreír,
                momentos bonitos y personas que te quieran
                de verdad.
            </p>

            <p class="frase">
                "Que cada día florezca algo bonito en tu vida." 🌻
            </p>

            <div class="firma">
                Con cariño 💛
            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
